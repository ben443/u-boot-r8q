name: Build U-Boot and Upload Artifacts

on:
  push:
    branches:
      - main
      - master
      - "copilot/**"
  pull_request:
  workflow_dispatch:

env:
  CROSS_COMPILE: aarch64-linux-gnu-
  OUTPUT_DIR: .output

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: "SM8250 Samsung Galaxy S20 FE (R8Q)"
            config: "sm8250-samsung-r8q"
          - name: "SM8250 Samsung Galaxy S20 Ultra 5G (X1Q)"
            config: "sm8250-samsung-x1q"

    name: Build ${{ matrix.device.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache build dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/apt
            /var/cache/apt
          key: ${{ runner.os }}-build-deps-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-build-deps-

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libgnutls28-dev \
            python3-dev \
            libpython3-dev

      - name: Get build information
        id: build_info
        run: |
          echo "git_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "git_branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "uboot_version=$(make --no-print-directory -C . kernelversion 2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT

      - name: Configure U-Boot for ${{ matrix.device.config }}
        run: |
          mkdir -p ${OUTPUT_DIR}
          make \
            CROSS_COMPILE=${CROSS_COMPILE} \
            O=${OUTPUT_DIR} \
            qcom_defconfig \
            qcom-phone.config \
            samsung-sm8250.config

      - name: Build U-Boot for ${{ matrix.device.config }}
        run: |
          make \
            CROSS_COMPILE=${CROSS_COMPILE} \
            O=${OUTPUT_DIR} \
            -j$(nproc) \
            CONFIG_DEFAULT_DEVICE_TREE="qcom/${{ matrix.device.config }}" \
            V=0

      - name: Build Device Tree Blob
        run: |
          make \
            CROSS_COMPILE=${CROSS_COMPILE} \
            O=${OUTPUT_DIR} \
            CONFIG_DEFAULT_DEVICE_TREE="qcom/${{ matrix.device.config }}" \
            dtbs \
            V=0

      - name: Verify build outputs
        run: |
          set -e
          ls -lh ${OUTPUT_DIR}/u-boot.bin
          ls -lh ${OUTPUT_DIR}/u-boot.dtb 2>/dev/null || echo "DTB may be optional"
          file ${OUTPUT_DIR}/u-boot.bin

      - name: Assemble U-Boot boot image
        continue-on-error: true
        run: |
          if [ -d "not/boot" ]; then
            cp ${OUTPUT_DIR}/u-boot.bin not/boot/kernel || true
            cp ${OUTPUT_DIR}/u-boot.dtb not/boot/kernel_dtb || true
            if [ -f not/boot.img ] && command -v ./not/boot/magiskboot &> /dev/null; then
              cp not/boot.img not/boot/boot.img
              cd not/boot/ && ./magiskboot --repack boot.img u-boot.img || true
              cd ../.. && cp not/boot/u-boot.img ${OUTPUT_DIR}/u-boot.img || true
            fi
          fi

      - name: Create build manifest
        run: |
          cat > ${OUTPUT_DIR}/BUILD_INFO.txt << EOF
          U-Boot Build Information
          ========================
          Device: ${{ matrix.device.name }}
          Config: ${{ matrix.device.config }}
          
          Build Details
          Git Commit: ${{ steps.build_info.outputs.git_commit }}
          Git Branch: ${{ steps.build_info.outputs.git_branch }}
          Build Date: ${{ steps.build_info.outputs.build_date }}
          U-Boot Version: ${{ steps.build_info.outputs.uboot_version }}
          
          Build Environment
          Runner OS: ${{ runner.os }}
          Runner Arch: ${{ runner.arch }}
          
          Output Files
          u-boot.bin: ARM64 U-Boot binary
          u-boot.dtb: Device Tree Blob
          u-boot.img: Boot image (if assembled)
          
          Documentation
          See NETHUNTER_BOOT.md for NetHunter Pro boot instructions
          EOF
          cat ${OUTPUT_DIR}/BUILD_INFO.txt

      - name: Prepare artifacts for upload
        run: |
          mkdir -p artifacts/${{ matrix.device.config }}
          cp ${OUTPUT_DIR}/u-boot.bin artifacts/${{ matrix.device.config }}/u-boot.bin || true
          cp ${OUTPUT_DIR}/u-boot.dtb artifacts/${{ matrix.device.config }}/u-boot.dtb || true
          cp ${OUTPUT_DIR}/u-boot.img artifacts/${{ matrix.device.config }}/u-boot.img || true
          cp ${OUTPUT_DIR}/BUILD_INFO.txt artifacts/${{ matrix.device.config }}/ || true
          ls -la artifacts/${{ matrix.device.config }}/

      - name: Upload artifacts - Binary
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-bin-${{ matrix.device.config }}
          path: artifacts/${{ matrix.device.config }}/u-boot.bin
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload artifacts - Device Tree
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-dtb-${{ matrix.device.config }}
          path: artifacts/${{ matrix.device.config }}/u-boot.dtb
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload artifacts - Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-img-${{ matrix.device.config }}
          path: artifacts/${{ matrix.device.config }}/u-boot.img
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload artifacts - Build Info
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-buildinfo-${{ matrix.device.config }}
          path: artifacts/${{ matrix.device.config }}/BUILD_INFO.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload all artifacts - Combined
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-${{ matrix.device.config }}-${{ steps.build_info.outputs.git_commit }}
          path: artifacts/${{ matrix.device.config }}/
          retention-days: 90

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary for ${{ matrix.device.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- Device: ${{ matrix.device.name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Config: ${{ matrix.device.config }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ steps.build_info.outputs.git_commit }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ steps.build_info.outputs.git_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- Built: ${{ steps.build_info.outputs.build_date }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/${{ matrix.device.config }}/u-boot.bin ]; then
            echo "- ✅ u-boot.bin ($(stat -f%z artifacts/${{ matrix.device.config }}/u-boot.bin 2>/dev/null || stat -c%s artifacts/${{ matrix.device.config }}/u-boot.bin 2>/dev/null || echo '?') bytes)" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f artifacts/${{ matrix.device.config }}/u-boot.dtb ]; then
            echo "- ✅ u-boot.dtb" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f artifacts/${{ matrix.device.config }}/u-boot.img ]; then
            echo "- ✅ u-boot.img" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find release-artifacts -type f -name "*.bin" -o -name "*.dtb" -o -name "*.img" -o -name "*.txt" | while read file; do
            cp "$file" release/
          done
          ls -la release/

      - name: Get tag information
        id: tag_info
        run: |
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "tag_subject=$(git cat-file -p ${GITHUB_REF#refs/tags/} | head -n 5)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            # U-Boot Release ${{ github.ref_name }}
            
            Pre-built U-Boot binaries for Samsung Galaxy S20 FE and S20 Ultra 5G
            
            ## Devices Supported
            - Samsung Galaxy S20 FE (R8Q) - SM8250
            - Samsung Galaxy S20 Ultra 5G (X1Q) - SM8250
            
            ## Files Included
            - `u-boot.bin` - Raw U-Boot binary
            - `u-boot.dtb` - Device Tree Blob
            - `u-boot.img` - Boot image (if available)
            - `BUILD_INFO.txt` - Build information
            
            ## Usage
            See [NETHUNTER_BOOT.md](./NETHUNTER_BOOT.md) for detailed installation and boot instructions.
            
            ## Build Information
            - Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            - U-Boot Version: 2026.10-rc2
            - Target: Qualcomm Snapdragon SM8250
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-to-releases:
    name: Upload Build Artifacts to Releases
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: build-artifacts

      - name: Organize artifacts
        run: |
          mkdir -p release-staging
          cd build-artifacts
          for dir in */; do
            device="${dir%/}"
            mkdir -p ../release-staging/$device
            find "$dir" -type f \( -name "*.bin" -o -name "*.dtb" -o -name "*.img" -o -name "*.txt" \) -exec cp {} ../release-staging/$device/ \;
          done
          cd ..
          ls -la release-staging/*/

      - name: Upload to GitHub Release (Latest)
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: nightly-latest
          name: Nightly Build
          body: |
            # Nightly U-Boot Build
            
            Latest pre-built U-Boot binaries from the main branch.
            
            **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            **Commit:** ${{ github.sha }}
            
            See [NETHUNTER_BOOT.md](./NETHUNTER_BOOT.md) for installation instructions.
          files: release-staging/*/*
          draft: false
          prerelease: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

