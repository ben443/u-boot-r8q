name: Build U-Boot and Upload Artifacts

on:
  workflow_dispatch:
    inputs:
      boot_image:
        description: "Repack U-Boot into not/boot.img (fails the build if it cannot be produced)"
        type: boolean
        default: true

env:
  CROSS_COMPILE: aarch64-linux-gnu-
  OUTPUT_DIR: .output
  ARTIFACT_DIR: artifacts/r8q
  # 1 = assemble u-boot-r8q-boot.img (default), 0 = explicitly omit it
  BUILD_BOOT_IMAGE: ${{ github.event.inputs.boot_image == 'false' && '0' || '1' }}

jobs:
  build:
    name: Build Samsung Galaxy S20 FE (R8Q)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache build dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/apt
            /var/cache/apt
          key: ${{ runner.os }}-build-deps-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-build-deps-

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            device-tree-compiler \
            libgnutls28-dev \
            python3-dev \
            libpython3-dev

      - name: Test packaging script
        run: .github/scripts/test-r8q-package.sh

      - name: Get build information
        id: build_info
        run: |
          echo "git_commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "git_branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "uboot_version=$(make --no-print-directory -C . kernelversion 2>/dev/null || echo 'unknown')" >> $GITHUB_OUTPUT

      - name: Configure U-Boot for Samsung S20 FE (R8Q)
        run: |
          mkdir -p ${OUTPUT_DIR}
          make \
            CROSS_COMPILE=${CROSS_COMPILE} \
            O=${OUTPUT_DIR} \
            qcom_defconfig \
            qcom-phone.config \
            samsung-sm8250.config \
            samsung-r8q.config
          grep -qx 'CONFIG_DEFAULT_DEVICE_TREE="qcom/sm8250-samsung-r8q"' ${OUTPUT_DIR}/.config
          grep -qx 'CONFIG_OF_SEPARATE=y' ${OUTPUT_DIR}/.config

      - name: Build U-Boot for Samsung S20 FE (R8Q)
        run: |
          make \
            CROSS_COMPILE=${CROSS_COMPILE} \
            O=${OUTPUT_DIR} \
            -j$(nproc) \
            V=0

      - name: Build Device Tree Blobs
        run: |
          make \
            CROSS_COMPILE=${CROSS_COMPILE} \
            O=${OUTPUT_DIR} \
            dtbs \
            V=0

      - name: Package and verify R8Q artifacts
        run: |
          if [ "${BUILD_BOOT_IMAGE}" = "1" ]; then
            .github/scripts/r8q-package.sh ${OUTPUT_DIR} ${ARTIFACT_DIR}
          else
            .github/scripts/r8q-package.sh --no-boot-image ${OUTPUT_DIR} ${ARTIFACT_DIR}
          fi
          ls -la ${ARTIFACT_DIR}

      - name: Create build manifest
        run: |
          if [ -f ${ARTIFACT_DIR}/u-boot-r8q-boot.img ]; then
            BOOT_IMG_LINE="u-boot-r8q-boot.img: Android boot image (header v2) - flash to the boot partition"
          else
            BOOT_IMG_LINE="u-boot-r8q-boot.img: NOT BUILT (boot image assembly was disabled for this run)"
          fi
          cat > ${ARTIFACT_DIR}/BUILD_INFO.txt << EOF
          U-Boot Build Information
          ========================
          Device: Samsung Galaxy S20 FE (R8Q) - SM8250
          Device tree: qcom/sm8250-samsung-r8q

          Build Details
          Git Commit: ${{ steps.build_info.outputs.git_commit }}
          Git Branch: ${{ steps.build_info.outputs.git_branch }}
          Build Date: ${{ steps.build_info.outputs.build_date }}
          U-Boot Version: ${{ steps.build_info.outputs.uboot_version }}

          Output Files
          ${BOOT_IMG_LINE}
          u-boot.bin: U-Boot with its control DTB appended (boot.img kernel payload / chain-loading)
          u-boot-control.dtb: U-Boot's own control DTB (already inside u-boot.bin; reference only)
          sm8250-samsung-r8q.dtb: Linux kernel DTB - copy to the boot partition next to Image
          SHA256SUMS: checksums of the files above

          Not verified by CI: booting on real R8Q hardware.
          See NETHUNTER_BOOT.md for flashing and Linux boot instructions.
          EOF
          (cd "${ARTIFACT_DIR}" && shopt -s nullglob && sha256sum -- *.bin *.dtb *.img > SHA256SUMS.tmp && mv SHA256SUMS.tmp SHA256SUMS)
          cat ${ARTIFACT_DIR}/BUILD_INFO.txt ${ARTIFACT_DIR}/SHA256SUMS

      - name: Upload artifact - U-Boot binary
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-r8q-bin
          path: ${{ env.ARTIFACT_DIR }}/u-boot.bin
          retention-days: 90
          if-no-files-found: error

      - name: Upload artifact - U-Boot control DTB
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-r8q-control-dtb
          path: ${{ env.ARTIFACT_DIR }}/u-boot-control.dtb
          retention-days: 90
          if-no-files-found: error

      - name: Upload artifact - Linux DTB
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-r8q-linux-dtb
          path: ${{ env.ARTIFACT_DIR }}/sm8250-samsung-r8q.dtb
          retention-days: 90
          if-no-files-found: error

      - name: Upload artifact - Android boot image
        if: env.BUILD_BOOT_IMAGE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-r8q-boot-img
          path: ${{ env.ARTIFACT_DIR }}/u-boot-r8q-boot.img
          retention-days: 90
          if-no-files-found: error

      - name: Upload artifact - Build info
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-r8q-buildinfo
          path: |
            ${{ env.ARTIFACT_DIR }}/BUILD_INFO.txt
            ${{ env.ARTIFACT_DIR }}/SHA256SUMS
          retention-days: 90
          if-no-files-found: error

      - name: Upload all artifacts - Combined
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-r8q-${{ steps.build_info.outputs.git_commit }}
          path: ${{ env.ARTIFACT_DIR }}/
          retention-days: 90
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Build Summary for Samsung Galaxy S20 FE (R8Q)"
            echo ""
            echo "**Build Status:** ${{ job.status }}"
            echo ""
            echo "### Build Information"
            echo "- Device tree: qcom/sm8250-samsung-r8q"
            echo "- Commit: ${{ steps.build_info.outputs.git_commit }}"
            echo "- Branch: ${{ steps.build_info.outputs.git_branch }}"
            echo "- Built: ${{ steps.build_info.outputs.build_date }}"
            echo ""
            echo "### Artifacts"
            for f in u-boot-r8q-boot.img u-boot.bin u-boot-control.dtb sm8250-samsung-r8q.dtb; do
              if [ -f ${ARTIFACT_DIR}/$f ]; then
                echo "- ✅ $f ($(stat -c%s ${ARTIFACT_DIR}/$f) bytes)"
              else
                echo "- ❌ $f not produced"
              fi
            done
            echo ""
            echo "CI only verifies the build and image layout; boot on real R8Q hardware is not tested."
          } >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: release-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find release-artifacts -type f \( -name "*.bin" -o -name "*.dtb" -o -name "*.img" -o -name "*.txt" -o -name SHA256SUMS \) -exec cp {} release/ \;
          ls -la release/

      - name: Get tag information
        id: tag_info
        run: |
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "tag_subject=$(git cat-file -p ${GITHUB_REF#refs/tags/} | head -n 5)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: ${{ github.ref_name }}
          body: |
            # U-Boot Release ${{ github.ref_name }}
            
            Pre-built U-Boot binaries for Samsung Galaxy S20 FE (R8Q)
            
            ## Device
            - Samsung Galaxy S20 FE (R8Q) - Qualcomm Snapdragon SM8250
            
            ## Files Included
            - `u-boot-r8q-boot.img` - Android boot image to flash to the `boot` partition
            - `u-boot.bin` - U-Boot with its control DTB appended (boot image payload / chain-loading)
            - `u-boot-control.dtb` - U-Boot's own control DTB (reference only, already inside `u-boot.bin`)
            - `sm8250-samsung-r8q.dtb` - Linux kernel DTB, copy next to `Image` on the boot partition
            - `BUILD_INFO.txt`, `SHA256SUMS` - Build information and checksums

            Booting on real hardware is not verified by CI.
            
            ## Usage
            See [NETHUNTER_BOOT.md](./NETHUNTER_BOOT.md) for detailed installation and boot instructions.
            
            ## Build Information
            - Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            - Target: Qualcomm Snapdragon SM8250 (R8Q)
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-to-releases:
    name: Upload Build Artifacts to Releases
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          path: build-artifacts

      - name: Organize artifacts
        run: |
          mkdir -p release-staging/r8q
          find build-artifacts -type f \( -name "*.bin" -o -name "*.dtb" -o -name "*.img" -o -name "*.txt" -o -name SHA256SUMS \) -exec cp {} release-staging/r8q/ \;
          ls -la release-staging/r8q/

      - name: Upload to GitHub Release (Latest)
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: nightly-latest
          name: Nightly Build - Samsung S20 FE (R8Q)
          body: |
            # Nightly U-Boot Build
            
            Latest pre-built U-Boot binaries from the main branch for Samsung Galaxy S20 FE (R8Q).
            
            **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
            **Commit:** ${{ github.sha }}
            **Device:** Samsung Galaxy S20 FE (R8Q) - Qualcomm Snapdragon SM8250
            
            See [NETHUNTER_BOOT.md](./NETHUNTER_BOOT.md) for installation instructions.
          files: release-staging/r8q/*
          draft: false
          prerelease: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
